<body>

    <!-- Header -->
    <header class="header">
        <nav class="navbar">

            <a class="logo" href="index.html">
                静岡の旅
            </a>

            <button class="menu-toggle">
                ☰
            </button>

            <ul class="nav-menu">

                <li>
                    <a href="index.html">
                        ホーム
                    </a>
                </li>

                <li>
                    <a href="about.html">

                    </a>

                <li>
                    <a href="index.html#destinations">
                        観光スポット

                <li>
                    <a href="food.html">

                <li>
                    <a href="gallery.html">

                    </a>

                <li>
                    <a class="active" href="access.html">

                    </a>
                </li>

                <li>
                    <a href="quiz.html">
                        クイズ
                    </a>
                </li>

                <li>
                    <button id="themeToggle" class="theme-btn">
                        🌙
                    </button>
                </li>

            </ul>

        </nav>
    </header>


    <!-- Main -->
    <main>

        <!-- Hero -->
        <section class="page-hero">

            <img
                src="images/shimizu-port.jfif"
                alt="清水港"
            >

            <div>

                <p>
                    ACCESS
                </p>

                <h1>
                    アクセス
                </h1>

                <span>
                    清水の旅をはじめよう
                </span>

            </div>

        </section>


        <!-- Access Section -->
        <section class="section">

            <div class="container">

                <p class="section-number">
                    01 — ACCESS
                </p>

                <h2>
                    清水駅を旅のスタート地点に
                </h2>


                <div class="access-grid">


                    <!-- Information -->
                    <div class="access-list">


                        <!-- Station -->
                        <div class="access-item">

                            <strong>
                                🚉 清水駅
                            </strong>

                            <p>
                                JR東海道本線の駅。
                                市内観光のスタート地点として便利です。
                            </p>

                        </div>


                        <!-- Port -->
                        <div class="access-item">

                            <strong>
                                ⚓ 清水港
                            </strong>

                            <p>
                                海の景色やクルーズを
                                楽しめるエリアです。
                            </p>

                        </div>


                        <!-- Miho -->
                        <div class="access-item">

                            <strong>
                                🌲 三保の松原
                            </strong>

                            <p>
                                海と松林、富士山の景色を
                                楽しめます。
                            </p>

                        </div>

                    </div>


                    <!-- Google Map -->
                    <div class="map-box">

                        <iframe
                            src="https://www.google.com/maps?q=Shimizu+Station+Shizuoka+Japan&output=embed"
                            loading="lazy"
                            title="清水駅の地図">
                        </iframe>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="container">

            <h3>
                静岡の旅
            </h3>

            <p>
                清水の旅を楽しもう。
            </p>

        </div>

    </footer>


    <!-- Back to Top -->
    <button id="topBtn" class="top-btn">
        ↑
    </button>

    <script src="script.js"></script>
